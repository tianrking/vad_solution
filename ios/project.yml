name: VadCutIOS
options:
  bundleIdPrefix: com.vadcut
  deploymentTarget:
    iOS: '15.1'
settings:
  base:
    SWIFT_VERSION: '5.10'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  VadCutIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/VadCutIOS
        excludes:
          - Resources
      - path: Sources/VadCutIOS/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vadcut.ios
        PRODUCT_NAME: VadCutIOS
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  VadCutIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/VadCutIOSTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: VadCutIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vadcut.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VadCutIOS:
    build:
      targets:
        VadCutIOS: all
    test:
      gatherCoverageData: true
      targets:
        - VadCutIOSTests
