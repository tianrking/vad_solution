services:
  audio-silence:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - audio-work:/tmp/audio-silence-service
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=16m,noexec,nosuid,nodev
      - /tmp:size=512m,noexec,nosuid,nodev

volumes:
  audio-work:
